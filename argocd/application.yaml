apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-status
  namespace: argocd
  finalizers:
    # Delete the app's Kubernetes resources when this Application is deleted
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Jackj119/shipfast-gitops.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: shipfast
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
