apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-status
  namespace: shipfast
  labels:
    app.kubernetes.io/name: flask-status
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-status
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: flask-status
          image: flask-status:jackj119
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-status-config
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
